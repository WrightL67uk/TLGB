name: Unpack TLGB code
on:
  push:
    paths:
      - tlgb-src.tar.xz
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          tar -xJf tlgb-src.tar.xz
          rm tlgb-src.tar.xz
          git config user.name "tlgb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add The Little Green Book site code"
          git push
