name: Unpack TLGB code
on:
  push:
    paths:
      - tlgb-src.tar.xz
      - update.b64
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          if [ -f tlgb-src.tar.xz ]; then tar -xJf tlgb-src.tar.xz && rm tlgb-src.tar.xz; fi
          if [ -f update.b64 ]; then base64 -d update.b64 > update.tar.xz && tar -xJf update.tar.xz && rm update.tar.xz update.b64; fi
          git config user.name "tlgb-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply site update" || echo "nothing to commit"
          git push
